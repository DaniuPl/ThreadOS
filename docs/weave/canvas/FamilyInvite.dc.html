<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family: an invitation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <div style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">19:02</div>

  <div style="padding: 26px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <div style="display: flex; align-items: center">
      <span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 3px solid #D152A6; padding: 3px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: #D152A6; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">N</span></span>
      <span style="width: 34px; height: 2px; background: linear-gradient(90deg, #D152A6, #5B7CFA)"></span>
      <span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 3px dashed #5B7CFA; padding: 3px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: #20232B; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #8FA5FF">A</span></span>
    </div>
    <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Ania asks you to join Family</h1>
    <p style="margin: 0; font-size: 14.5px; color: #B4B9C6; line-height: 1.5">She already shares where she is with you. Would you share back?</p>
  </div>

  <div role="radiogroup" aria-label="How long" style="margin: 22px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; border: {{o.border}}; background: {{o.bg}}; color: #ECEDF2; text-align: left; font-family: Inter, sans-serif">
        <span style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 2px solid {{o.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{o.ring}}; opacity: {{o.dot}}"></span></span>
        <span><span style="display: block; font-size: 15.5px; font-weight: 700">{{o.name}}</span><span style="display: block; font-size: 12.5px; color: #9AA0AE; margin-top: 2px">{{o.body}}</span></span>
      </button>
    </sc-for>
  </div>

  <div style="margin: 16px 20px 0; position: relative; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #C9CDD8">
    <div style="position: absolute; left: 5px; top: 5px; bottom: 5px; width: 2px; border-left: 2px dashed #46C27A"></div>
    <div style="position: relative"><span style="position: absolute; left: -22px; top: 3px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid #46C27A; background: #0D0F15"></span>Ania sees your place and your phone's battery</div>
    <div style="position: relative"><span style="position: absolute; left: -22px; top: 3px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid #46C27A; background: #0D0F15"></span>The shuttle shows whenever you share</div>
    <div style="position: relative"><span style="position: absolute; left: -22px; top: 3px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid #46C27A; background: #0D0F15"></span>You can stop from Family or the shade, at any time</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
    <a href="FamilyPhone.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #5B7CFA; color: #FFFFFF; font: 700 16px Inter, sans-serif; text-decoration: none">{{cta}}</a>
    <a href="#" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 14px; color: #C9CDD8; font: 500 15px Inter, sans-serif; text-decoration: none">Not now</a>
  </div>
  <!-- the thread: the phone's navigation, every running program a knot -->
  <div aria-label="The thread" style="position: absolute; left: 16px; right: 16px; bottom: 6px; height: 22px">
    <div style="position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3A3F4C"></div>
    <div style="position: absolute; left: 50%; top: 9px; width: 56px; margin-left: -28px; height: 4px; border-radius: 2px; background: #D152A6"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; justify-content: center; align-items: center; gap: 16px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #4A6BE0"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #1FA3A3"></span><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #D152A6; border: 2px solid #FFFFFF"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #C77F0A"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (this.state && this.state.o) || 'hour';
    const defs = [
      { id: 'stop', name: 'Until I stop', body: 'Ania sees where you are whenever she opens Family', cta: 'Share until I stop' },
      { id: 'hour', name: 'For one hour', body: 'Then it stops by itself, and Ania is told', cta: 'Share for one hour' },
      { id: 'once', name: 'Just this once', body: 'Where you are now, sent once; nothing after', cta: 'Send where I am now' }
    ];
    const opts = defs.map((d) => {
      const on = d.id === pick;
      return Object.assign({}, d, { checked: on ? 'true' : 'false', border: on ? '2px solid #5B7CFA' : '2px solid #262A33', bg: on ? '#1A1C23' : '#14161B', ring: on ? '#5B7CFA' : '#4A4F5C', dot: on ? 1 : 0, pick: () => this.setState({ o: d.id }) });
    });
    return { opts, cta: defs.find((d) => d.id === pick).cta };
  }
}
</script>
</body>
</html>
