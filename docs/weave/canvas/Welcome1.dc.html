<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome: language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2; display: flex; flex-direction: column; align-items: center; padding-top: 44px; box-sizing: border-box">
  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
    <path d="M -40 820 C 300 720, 520 900, 820 760 S 1240 600, 1500 650" stroke="#5B7CFA" stroke-opacity="0.45" stroke-width="3"></path>
    <path d="M -40 860 C 260 800, 560 920, 860 800 S 1260 680, 1500 720" stroke="#2EC4C4" stroke-opacity="0.3" stroke-width="2"></path>
    <path d="M -40 780 C 340 690, 480 860, 790 730 S 1220 570, 1500 610" stroke="#D152A6" stroke-opacity="0.25" stroke-width="2"></path>
  </svg>

  <nav aria-label="Setup steps" style="position: relative; display: flex; width: 640px">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
      <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: {{st.line}}"></div>
        <span style="position: relative; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: {{st.fill}}; border: 2px solid {{st.ring}}"></span>
        <span style="font-size: 12px; color: {{st.fg}}; font-weight: {{st.weight}}">{{st.label}}</span>
      </div>
    </sc-for>
  </nav>

  <div style="position: relative; margin-top: 56px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
    <div style="width: 84px; height: 84px; border-radius: 22px; background: #5B7CFA; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(91,124,250,0.35)">
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 96.59 96.42"><g fill="#FFFFFF"><path d="m78.54,26.05l-10.86,10.96c-1.69-1.63-3.54-2.89-5.82-3.96-.02-.02-.05-.03-.06-.03-.51-.25-1.08-.49-1.73-.72l-.05-.02h0c-2.47-.91-5.06-1.37-7.69-1.37-2.44,0-4.85.4-7.17,1.19-.14.05-.28.09-.42.14-.45.16-1.04.39-1.6.67-.07.02-.13.05-.18.07l-.06.03c-2.39,1.11-4.54,2.62-6.4,4.5-1.68,1.7-3.07,3.63-4.12,5.73-.09.19-.18.37-.27.57-.26.54-.5,1.11-.71,1.73l-.06.14c-1.71,4.75-1.74,10-.1,14.75.03.11.07.22.1.32.03.06.05.12.07.19.2.57.45,1.13.7,1.68l.11.24s.03.07.04.09c1.03,2.12,2.17,3.73,3.9,5.48l-10.17,10.27c-1.71-1.71-2.84-3.13-3.95-4.96l4.2-4.23c.63-.64.76-1.6.33-2.4-.94-1.74-1.7-3.58-2.27-5.49-.26-.87-1.04-1.46-1.94-1.46-2.01.01-4.01.01-6.01.02-1.18-4.72-1.2-9.5-.05-14.23h3.65s2.51-.03,2.51-.03c.89,0,1.66-.59,1.93-1.46.55-1.83,1.3-3.61,2.23-5.3.44-.81.31-1.79-.33-2.42l-4.43-4.39c2.49-4.18,5.86-7.57,10.01-10.1l4.6,4.55c.37.37.87.58,1.41.58.33,0,.67-.09.97-.24,1.63-.85,3.36-1.56,5.15-2.1.88-.27,1.47-1.05,1.46-1.94,0-2.18-.02-4.36-.03-6.54,2.38-.6,4.81-.91,7.23-.91s4.69.28,7,.84v3.25s.03,3.47.03,3.47c0,.89.59,1.66,1.46,1.93,1.71.52,3.38,1.21,4.98,2.04.3.16.64.25.97.25.54,0,1.05-.21,1.43-.59l4.73-4.78c2.08,1.24,3.72,2.48,5.28,3.99Z"></path><polygon points="78.13 45.24 74.27 47.69 70.68 49.98 71.1 48.25 71.18 47.94 48.45 47.94 49.75 42.6 72.47 42.6 72.52 42.41 72.99 40.51 75.52 42.85 78.13 45.24"></polygon><polygon points="68.45 58.7 64.6 61.15 60.99 63.44 61.42 61.71 61.49 61.4 45.12 61.4 46.43 56.06 62.8 56.06 62.85 55.87 63.32 53.97 65.85 56.3 68.45 58.7"></polygon><polygon points="75.82 73.27 71.96 75.71 68.37 78 68.79 76.27 68.87 75.96 41.55 75.96 42.86 70.63 70.17 70.63 70.21 70.44 70.68 68.53 73.21 70.87 75.82 73.27"></polygon></g></svg>
    </div>
    <h1 style="margin: 0; font-size: 48px; font-weight: 800; letter-spacing: -0.03em">{{t.title}}</h1>
    <p style="margin: 0; font-size: 16px; color: #B4B9C6; max-width: 560px; line-height: 1.5">{{t.sub}}</p>
  </div>

  <div style="position: relative; margin-top: 36px; width: 720px; display: flex; flex-direction: column; gap: 22px">
    <div role="radiogroup" aria-label="Language" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 14px; border: {{l.border}}; background: {{l.bg}}; color: #ECEDF2; text-align: left; font-family: Inter, sans-serif">
          <span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{l.ring}}; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{l.dot}}"></span></span>
          <span style="flex-grow: 1"><span style="display: block; font-size: 18px; font-weight: 700">{{l.name}}</span><span style="display: block; font-size: 13px; color: #9AA0AE; margin-top: 2px">{{l.sample}}</span></span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-radius: 14px; background: #14161B; border: 1px solid #262A33">
      <div><div style="font-size: 14px; font-weight: 600">{{t.kbd}}</div><div style="font-size: 12.5px; color: #9AA0AE; margin-top: 2px">{{t.kbdSub}}</div></div>
      <div role="group" aria-label="Keyboard layout" style="display: inline-flex; padding: 3px; border-radius: 9px; background: #1B1D24; border: 1px solid #2E323D">
        <button style="height: 30px; padding: 0 14px; border-radius: 6px; border: 0; background: transparent; color: #B4B9C6; font: 500 13px Inter, sans-serif">US</button>
        <button style="height: 30px; padding: 0 14px; border-radius: 6px; border: 0; background: #2A2D36; color: #FFFFFF; font: 600 13px Inter, sans-serif; box-shadow: inset 0 -2px 0 #5B7CFA">Polish (programmer's)</button>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12.5px; color: #9AA0AE">{{t.try}}</span>
      <input value="Zażółć gęślą jaźń" style="height: 40px; box-sizing: border-box; padding: 0 14px; border-radius: 10px 10px 4px 4px; border: 0; border-bottom: 2px solid #5B7CFA; background: #1B1D24; color: #ECEDF2; font: 400 15px Inter, sans-serif; outline: none">
    </label>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 12px">
    <a href="Welcome2.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 28px; border-radius: 11px; background: #5B7CFA; color: #FFFFFF; font: 600 15px Inter, sans-serif; text-decoration: none">{{t.go}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = (this.state && this.state.lang) || 'en';
    const T = {
      en: { title: 'Welcome to ThreadOS', sub: 'A few choices and your computer is yours. Each one can be changed later in Settings.', kbd: 'Keyboard', kbdSub: 'The keys stay where they are printed; Right Alt makes the Polish letters', try: 'Try it here', go: 'Continue' },
      pl: { title: 'Witaj w ThreadOS', sub: 'Kilka wyborów i komputer jest Twój. Każdy z nich zmienisz później w Ustawieniach.', kbd: 'Klawiatura', kbdSub: 'Klawisze zostają tam, gdzie są nadrukowane; prawy Alt daje polskie litery', try: 'Wypróbuj tutaj', go: 'Dalej' }
    };
    const labels = lang === 'pl' ? ['Język', 'Sieć', 'Ty', 'Styl', 'Gotowe'] : ['Language', 'Network', 'You', 'Style', 'Ready'];
    const cur = 0;
    const steps = labels.map((label, i) => ({
      label,
      line: i === 0 ? 'transparent' : (i <= cur ? '#5B7CFA' : '#2E323D'),
      fill: i <= cur ? '#5B7CFA' : '#0D0F15',
      ring: i <= cur ? '#5B7CFA' : '#4A4F5C',
      fg: i === cur ? '#FFFFFF' : (i < cur ? '#B4B9C6' : '#6A7080'),
      weight: i === cur ? 700 : 500
    }));
    const langs = [
      { id: 'en', name: 'English', sample: 'Settings, Files, Shut down' },
      { id: 'pl', name: 'Polski', sample: 'Ustawienia, Pliki, Wyłącz' }
    ].map((l) => {
      const on = l.id === lang;
      return Object.assign({}, l, {
        checked: on ? 'true' : 'false',
        border: on ? '2px solid #5B7CFA' : '2px solid #262A33',
        bg: on ? '#1A1C23' : '#14161B',
        ring: on ? '#5B7CFA' : '#4A4F5C', dot: on ? '#5B7CFA' : 'transparent',
        pick: () => this.setState({ lang: l.id })
      });
    });
    return { t: T[lang], steps, langs };
  }
}
</script>
</body>
</html>
