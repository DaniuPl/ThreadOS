<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
    <path d="M -40 520 C 380 380, 460 660, 760 470 S 1200 190, 1500 230" stroke="#46C27A" stroke-opacity="0.3" stroke-width="1.5"></path>
    <path d="M -40 580 C 340 450, 480 720, 790 530 S 1220 250, 1500 300" stroke="#D152A6" stroke-opacity="0.45" stroke-width="2"></path>
    <path d="M -40 640 C 300 540, 520 780, 820 580 S 1240 320, 1500 370" stroke="#5B7CFA" stroke-opacity="0.75" stroke-width="3"></path>
    <path d="M -40 700 C 260 620, 560 840, 860 630 S 1260 390, 1500 440" stroke="#2EC4C4" stroke-opacity="0.45" stroke-width="2"></path>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 110px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="font-size: 18px; font-weight: 500; color: #C9CDD8">Thursday, 19 November</div>
    <div style="font-size: 132px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums">12:36</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 430px; display: flex; flex-direction: column; align-items: center; gap: 16px">
    <div role="radiogroup" aria-label="Who" style="display: flex; gap: 22px; align-items: flex-end">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{p.checked}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #ECEDF2; font: {{p.weight}} 14px Inter, sans-serif; opacity: {{p.op}}">
          <span style="width: {{p.size}}; height: {{p.size}}; box-sizing: border-box; border-radius: 50%; border: 3px solid {{p.dye}}; padding: 4px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: {{p.dye}}; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">{{p.initial}}</span></span>
          {{p.name}}
        </button>
      </sc-for>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; width: 300px; height: 46px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 12px 12px 5px 5px; background: rgba(26,28,35,0.92); border: 1px solid #2E323D; border-bottom: 2px solid #5B7CFA">
      <input type="password" aria-label="Password for Alex" placeholder="Password" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #ECEDF2; font: 400 15px Inter, sans-serif; outline: none">
      <button aria-label="Unlock" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: #5B7CFA; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </label>
    <div style="font-size: 12.5px; color: #8A90A0">Keyboard: Polish (programmer's)</div>
  </div>

  <!-- while locked, the shuttle says only that something waits, never what -->
  <div style="position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); display: flex; align-items: center; gap: 0">
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 10px; border-radius: 999px; background: #1F2229; border: 1px solid #353A46">
      <span style="width: 26px; height: 26px; border-radius: 50%; background: #5B7CFA"></span><span style="font-size: 13px; font-weight: 600">Recording 3</span>
      <button aria-label="Pause" style="width: 28px; height: 28px; border-radius: 50%; border: 0; background: #ECEDF2; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="#0D0F15"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
    </div>
    <span style="width: 24px; height: 2px; background: #5B7CFA"></span>
    <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: #1F2229; border: 1px solid #353A46; font-size: 13px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D152A6"></span>3 messages waiting</div>
  </div>
  <div style="position: absolute; left: 50%; bottom: 40px; width: 2px; height: 34px; background: #5B7CFA"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 22px; display: flex; justify-content: space-between; padding: 0 30px; font-size: 13px; color: #C9CDD8">
    <span style="display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9CDD8" stroke-width="2" stroke-linecap="round"><path d="M3 9a14 14 0 0 1 18 0"></path><path d="M6 12.5a9 9 0 0 1 12 0"></path><path d="M9 16a4 4 0 0 1 6 0"></path></svg>Home-5G · 82 %</span>
    <span style="display: flex; gap: 8px">
      <button aria-label="Restart" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid #2E323D; background: rgba(20,22,27,0.9); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#C9CDD8" stroke-width="2" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.1-5"></path><path d="M19 4v4h-4"></path></svg></button>
      <button aria-label="Shut down" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(229,72,77,0.5); background: rgba(229,72,77,0.1); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF8A8D" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v8"></path><path d="M7 7a7 7 0 1 0 10 0"></path></svg></button>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const people = [['Ola', 'O', '#2EC4C4', false], ['Alex', 'A', '#5B7CFA', true], ['Guest', 'G', '#4B505E', false]].map((p) => ({ name: p[0], initial: p[1], dye: p[2], checked: p[3] ? 'true' : 'false', size: p[3] ? '92px' : '64px', op: p[3] ? 1 : 0.6, weight: p[3] ? 700 : 500 }));
    return { people };
  }
}
</script>
</body>
</html>
