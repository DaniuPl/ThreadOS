name: Bug report
description: Something behaves differently from what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        The serial log is worth more than a description of the symptom -
        the system writes almost everything it knows there.

  - type: dropdown
    id: kernel
    attributes:
      label: Which kernel
      options:
        - 64-bit (long mode)
        - 32-bit (protected mode)
        - both
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where it runs
      options:
        - QEMU
        - real hardware
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: How it was started
      description: The QEMU command line, or the machine and how it boots (BIOS or UEFI).
      placeholder: qemu-system-x86_64 -cdrom build/threados64.iso ...
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what was expected instead
    validations:
      required: true

  - type: textarea
    id: serial
    attributes:
      label: The serial log
      description: |
        QEMU: add `-serial file:log.txt`. On real hardware, a photograph of
        the screen will do. `hardware` and `disks` typed into the system are
        worth attaching too.
      render: text
