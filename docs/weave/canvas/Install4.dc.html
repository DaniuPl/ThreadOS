<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Install: writing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #08090D; font-family: Inter, system-ui, sans-serif; color: #ECEDF2; display: flex; flex-direction: column; align-items: center; padding-top: 30px; box-sizing: border-box">
  <div style="position: absolute; left: 32px; top: 30px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700"><span style="width: 22px; height: 22px; border-radius: 6px; background: #5B7CFA"></span>Install ThreadOS</div>

  <nav aria-label="Install steps" style="position: relative; display: flex; width: 520px">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
      <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: {{st.line}}"></div>
        <span style="position: relative; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: {{st.fill}}; border: 2px solid {{st.ring}}"></span>
        <span style="font-size: 12px; color: {{st.fg}}; font-weight: {{st.weight}}">{{st.label}}</span>
      </div>
    </sc-for>
  </nav>

  <div style="margin-top: 54px; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="font: 800 84px Inter, sans-serif; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">{{pct}}<span style="font-size: 40px; color: #8A90A0"> %</span></div>
    <div style="font-size: 16px; color: #B4B9C6">Weaving ThreadOS onto the disk · about 2 minutes left</div>
  </div>

  <!-- the partition fills like cloth on a loom: woven where it is written, bare warp where it is not yet -->
  <a href="Install5.dc.html" aria-label="ThreadOS partition being written, {{pct}} percent" style="margin-top: 34px; display: flex; height: 56px; width: 904px; gap: 3px; text-decoration: none">
    <div style="width: 3%; border-radius: 10px 3px 3px 10px; background: #3A3F4C; box-shadow: inset 0 -3px 0 #5B7CFA"></div>
    <div style="width: 71%; border-radius: 3px; background: #1B1D24; display: flex; align-items: center; padding: 0 14px; font-size: 12.5px; color: #6A7080">Another system · untouched</div>
    <div style="position: relative; flex-grow: 1; border-radius: 3px 10px 10px 3px; overflow: hidden; background-image: repeating-linear-gradient(90deg, rgba(91,124,250,0.45) 0px, rgba(91,124,250,0.45) 2px, transparent 2px, transparent 6px); background-color: #111318">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{pctW}}; background-color: #5B7CFA; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.16) 0px, rgba(255,255,255,0.16) 2px, transparent 2px, transparent 5px), repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 2px, transparent 2px, transparent 5px)"></div>
      <div style="position: absolute; top: -4px; bottom: -4px; left: {{pctW}}; width: 3px; margin-left: -1px; background: #FFFFFF; box-shadow: 0 0 12px #FFFFFF"></div>
    </div>
  </a>

  <section aria-label="Steps" style="margin-top: 34px; width: 560px; position: relative; padding-left: 28px">
    <div style="position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(#5B7CFA 66%, #2E323D 66%)"></div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{log}}" as="l" hint-placeholder-count="6">
        <div style="position: relative; display: flex; align-items: baseline; gap: 12px">
          <span style="position: absolute; left: -28px; top: 3px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: {{l.fill}}; border: 2px solid {{l.ring}}"></span>
          <span style="flex-grow: 1; font-size: 14.5px; font-weight: {{l.weight}}; color: {{l.fg}}">{{l.what}}</span>
          <span style="font: 400 12.5px 'JetBrains Mono', monospace; color: {{l.metaColor}}">{{l.meta}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #FF8A8D">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #E5484D"></span>Do not switch the computer off or pull the stick out.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pct":{"editor":"range","default":62,"min":0,"max":100,"step":1,"unit":"%"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 2;
    const steps = ['Where', 'Check', 'Write', 'Done'].map((label, i) => ({
      label,
      line: i === 0 ? 'transparent' : (i <= cur ? '#5B7CFA' : '#2E323D'),
      fill: i <= cur ? '#5B7CFA' : '#08090D',
      ring: i <= cur ? '#5B7CFA' : '#4A4F5C',
      fg: i === cur ? '#FFFFFF' : (i < cur ? '#B4B9C6' : '#6A7080'),
      weight: i === cur ? 700 : 500
    }));
    const pct = Math.max(0, Math.min(100, Math.round(this.props.pct ?? 62)));
    const rows = [
      ['threadboot onto the EFI partition', 'done', 'done'],
      ['The ThreadOS partition, TFS', 'done', 'done'],
      ['The kernel', 'done', 'done'],
      ['The initrd', 'done', 'done'],
      ['Weft', 'now', '112 of 180 MB'],
      ['The boot entry', 'next', 'next']
    ];
    const log = rows.map((r) => ({
      what: r[0], meta: r[2],
      fill: r[1] === 'done' ? '#5B7CFA' : (r[1] === 'now' ? '#FFFFFF' : '#08090D'),
      ring: r[1] === 'next' ? '#4A4F5C' : '#5B7CFA',
      fg: r[1] === 'next' ? '#6A7080' : '#ECEDF2',
      weight: r[1] === 'now' ? 700 : 500,
      metaColor: r[1] === 'now' ? '#8FA5FF' : '#6A7080'
    }));
    return { steps, pct, pctW: pct + '%', log };
  }
}
</script>
</body>
</html>
