# Menu rozruchowe jadra 64-bitowego (ta sama plyta dla BIOS-u i UEFI)
#
# insmod all_video wciaga sterowniki obrazu - pod UEFI jest to efi_gop,
# jedyna droga do bufora obrazu, bo trybu tekstowego VGA tam nie ma.
insmod all_video
set gfxpayload=keep

set timeout=0
set default=0

menuentry "ProtonOS 64" {
    multiboot2 /boot/protonos64.bin
}
