# Menu rozruchowe ProtonOS (GRUB, obraz ISO)
#
# Domyslnie system wchodzi prosto na pulpit graficzny. Druga pozycja
# zostawia konsole tekstowa - przydaje sie, gdy karta nie daje VESA
# albo gdy chcemy patrzec na komunikaty jadra.

set timeout=3
set default=0

menuentry "ProtonOS (pulpit graficzny)" {
    multiboot2 /boot/protonos.bin
    module2 /boot/initrd.img
}

menuentry "ProtonOS (konsola tekstowa)" {
    multiboot2 /boot/protonos.bin nodesktop
    module2 /boot/initrd.img
}
