<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weft, linen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5EE8}a:hover{color:#2A45C0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #E6E1D6; font-family: Inter, system-ui, sans-serif; color: #1D1C1A">

  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
    <path d="M -40 640 C 300 540, 520 780, 820 580 S 1240 320, 1500 370" stroke="#3F5EE8" stroke-opacity="0.5" stroke-width="3"></path>
    <path d="M -40 700 C 260 620, 560 840, 860 630 S 1260 390, 1500 440" stroke="#1E7F86" stroke-opacity="0.35" stroke-width="2"></path>
    <path d="M -40 580 C 340 450, 480 720, 790 530 S 1220 250, 1500 300" stroke="#C2366F" stroke-opacity="0.3" stroke-width="2"></path>
  </svg>

  <section aria-label="Weft window" style="position: absolute; left: 24px; top: 18px; width: 1392px; height: 790px; border-radius: 10px; overflow: hidden; background: #FAF8F4; border: 1px solid #D3CCBE; box-shadow: 0 22px 56px rgba(60,50,30,0.22), 0 2px 6px rgba(60,50,30,0.1); display: flex; flex-direction: column">
    <div style="height: 3px; background: #3F5EE8"></div>

    <div style="height: 42px; display: flex; align-items: flex-end; gap: 4px; padding: 0 8px 0 10px; background-color: #EDE8DE; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.022) 0px, rgba(0,0,0,0.022) 1px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px)">
      <div role="tablist" aria-label="Tabs" style="display: flex; align-items: flex-end; gap: 2px; flex-grow: 1; min-width: 0">
        <div role="tab" aria-selected="true" style="display: flex; align-items: center; gap: 8px; width: 220px; height: 34px; box-sizing: border-box; padding: 0 10px 0 12px; border-radius: 9px 9px 0 0; background: #FAF8F4; font-size: 13px; font-weight: 600">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #3F5EE8"></span>
          <span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Start</span>
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B675F" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg>
        </div>
        <div role="tab" aria-selected="false" style="display: flex; align-items: center; gap: 8px; width: 220px; height: 34px; box-sizing: border-box; padding: 0 12px; font-size: 13px; color: #4A4740; border-right: 1px dashed #CFC8BA">
          <span style="width: 14px; height: 14px; border-radius: 4px; background: #1E7F86"></span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Weft notes — what is left</span>
        </div>
        <div role="tab" aria-selected="false" style="display: flex; align-items: center; gap: 8px; width: 220px; height: 34px; box-sizing: border-box; padding: 0 12px; font-size: 13px; color: #4A4740">
          <span style="width: 14px; height: 14px; border-radius: 4px; background: #C2366F"></span>
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Test results, last run</span>
          <span aria-label="Playing sound" style="display: flex; align-items: flex-end; gap: 2px; height: 12px"><span style="width: 2px; height: 6px; background: #C2366F"></span><span style="width: 2px; height: 11px; background: #C2366F"></span><span style="width: 2px; height: 8px; background: #C2366F"></span></span>
        </div>
        <button aria-label="New tab" style="width: 30px; height: 30px; margin: 0 0 2px 4px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A4740" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <div style="display: flex; gap: 2px; padding: 3px; margin-bottom: 6px; border-radius: 999px; background: rgba(0,0,0,0.05)">
        <button aria-label="Minimise" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4A4740" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
        <button aria-label="Maximise" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4A4740" stroke-width="2.4" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
        <button aria-label="Close" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(201,48,44,0.12); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C9302C" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </div>
    </div>

    <div style="height: 50px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid #E3DDD1">
      <button aria-label="Back" style="width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <button aria-label="Forward" style="width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3AC9F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button aria-label="Reload" style="width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1C1A" stroke-width="2.2" stroke-linecap="round"><path d="M19 12a7 7 0 1 1-2.1-5"></path><path d="M19 4v4h-4"></path></svg></button>
      <label style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 36px; box-sizing: border-box; padding: 0 14px; margin: 0 8px; border-radius: 9px 9px 4px 4px; background: #F1EDE5; border-bottom: 2px dashed #C9C1B2">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B675F" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
        <input aria-label="Address" placeholder="Search, or type an address" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #1D1C1A; font: 400 14px Inter, sans-serif; outline: none">
      </label>
      <button aria-label="Reading thread" style="width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1C1A" stroke-width="2.2" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"></path></svg></button>
      <button aria-label="Downloads, one running" style="position: relative; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1C1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg><span style="position: absolute; right: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: #1E7F86; border: 2px solid #FAF8F4"></span></button>
      <button aria-label="Menu" style="width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#1D1C1A"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></button>
    </div>

    <main style="flex-grow: 1; position: relative; overflow: hidden; display: flex; justify-content: center; background-color: #F6F3EC; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.016) 0px, rgba(0,0,0,0.016) 1px, transparent 1px, transparent 3px)">
      <div style="width: 760px; padding-top: 64px; display: flex; flex-direction: column; gap: 34px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <div style="font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">Weft</div>
            <svg aria-hidden="true" width="120" height="14" viewBox="0 0 120 14" fill="none"><path d="M2 8 C 30 0, 50 14, 80 6 S 110 4, 118 7" stroke="#3F5EE8" stroke-width="3" stroke-linecap="round"></path></svg>
          </div>
          <label style="width: 100%; display: flex; align-items: center; gap: 12px; height: 54px; box-sizing: border-box; padding: 0 18px; border-radius: 14px 14px 6px 6px; background: #FFFFFF; border: 1px solid #DDD6C9; border-bottom: 2px solid #3F5EE8; box-shadow: 0 8px 24px rgba(60,50,30,0.08)">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F5EE8" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
            <input aria-label="Search the web" placeholder="Search the web, or type an address" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #1D1C1A; font: 400 16px Inter, sans-serif; outline: none">
            <span style="font-size: 12px; color: #6B675F">Enter</span>
          </label>
        </div>

        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
          <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
            <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; border-radius: 12px; background: #FCFBF8; border: 1px solid #E3DDD1; text-decoration: none; color: #1D1C1A">
              <span style="width: 40px; height: 40px; border-radius: 11px; background: {{p.dye}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 700; font-size: 16px">{{p.glyph}}</span>
              <span style="font-size: 12.5px; font-weight: 500">{{p.name}}</span>
            </a>
          </sc-for>
        </div>

        <div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px">
          <section aria-label="Reading thread" style="background: #FCFBF8; border: 1px solid #E3DDD1; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B675F">Reading thread</h2>
            <div style="position: relative; display: flex; flex-direction: column; gap: 12px; padding-left: 20px">
              <div style="position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px; background: #DDD6C9"></div>
              <sc-for list="{{reading}}" as="r" hint-placeholder-count="3">
                <div style="position: relative">
                  <span style="position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; background: {{r.knot}}; border: 2px solid {{r.ring}}"></span>
                  <div style="font-size: 14px; font-weight: 600">{{r.title}}</div>
                  <div style="font-size: 12px; color: #6B675F; margin-top: 2px">{{r.meta}}</div>
                </div>
              </sc-for>
            </div>
          </section>
          <section aria-label="Downloads" style="background: #FCFBF8; border: 1px solid #E3DDD1; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
            <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B675F">Downloads</h2>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">gstreamer-1.26.tar.xz</span><span style="color: #6B675F">41 %</span></div>
              <div style="position: relative; height: 10px">
                <div style="position: absolute; left: 0; right: 0; top: 4px; border-top: 2px dashed #CFC8BA"></div>
                <div style="position: absolute; left: 0; top: 3px; width: 41%; height: 4px; border-radius: 2px; background: #1E7F86"></div>
                <div style="position: absolute; left: 41%; top: 0; width: 10px; height: 10px; margin-left: -5px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #1E7F86"></div>
              </div>
              <div style="font-size: 12px; color: #6B675F">5.1 of 12.4 MB · 2 MB/s</div>
            </div>
            <div style="border-top: 1px dashed #DDD6C9"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px"><span>threados-0.1.0.iso</span><span style="display: flex; align-items: center; gap: 6px; color: #1E8A4C; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: #1E8A4C"></span>Done</span></div>
          </section>
        </div>
      </div>
    </main>

    <div style="height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-top: 1px solid #E3DDD1; font-size: 12px; color: #6B675F">
      <span>weft:start</span><span>WebKit · 3 tabs · 1 playing</span>
    </div>
  </section>

  <nav aria-label="Loom" style="position: absolute; left: 16px; right: 16px; bottom: 14px; height: 58px; box-sizing: border-box; border-radius: 14px; background-color: #FAF8F4; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.022) 0px, rgba(0,0,0,0.022) 1px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px); border: 1px solid #D3CCBE; box-shadow: 0 10px 28px rgba(60,50,30,0.14); display: flex; align-items: center; padding: 0 10px; gap: 14px">
    <button aria-label="Open the spool" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: #3F5EE8; color: #FFFFFF; font: 800 16px Inter, sans-serif">T</button>
    <div style="flex-grow: 1; display: flex; justify-content: center">
      <div style="position: relative; display: flex; gap: 10px; padding: 0 4px 10px">
        <div style="position: absolute; left: 0; right: 0; bottom: 3px; height: 1px; background: #D3CCBE"></div>
        <sc-for list="{{apps}}" as="a" hint-placeholder-count="7">
          <div style="position: relative; display: flex; flex-direction: column; align-items: center">
            <button aria-label="{{a.name}}" style="width: 38px; height: 38px; border-radius: 10px; border: 0; padding: 0; background: {{a.dye}}; color: #FFFFFF; font: 700 15px Inter, sans-serif">{{a.glyph}}</button>
            <div style="position: absolute; bottom: -9px; height: 3px; width: {{a.threadW}}; border-radius: 2px; background: {{a.thread}}"></div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; padding: 0 6px 0 12px; border-left: 1px dashed #D3CCBE; line-height: 1.15">
      <div style="font-size: 15px; font-weight: 700">15:04</div>
      <div style="font-size: 11px; color: #6B675F">Thu 19 Nov</div>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const run = (r) => ({ thread: r === 'focus' ? '#3F5EE8' : (r === 'yes' ? '#8A857B' : 'transparent'), threadW: r === 'focus' ? '30px' : '14px' });
    const apps = [
      { name: 'Files', glyph: 'F', dye: '#3F5EE8', r: 'yes' },
      { name: 'Weft', glyph: 'W', dye: '#1E7F86', r: 'focus' },
      { name: 'Term', glyph: '>', dye: '#2B2A27', r: 'no' },
      { name: 'Code', glyph: '{', dye: '#9C2F75', r: 'no' },
      { name: 'Recorder', glyph: 'R', dye: '#B86E00', r: 'no' },
      { name: 'Gallery', glyph: 'G', dye: '#1E8A4C', r: 'no' },
      { name: 'Settings', glyph: 'S', dye: '#6B675F', r: 'no' }
    ].map((a) => ({ ...a, ...run(a.r) }));
    return {
      apps,
      pins: [
        { name: 'Journal', glyph: 'J', dye: '#3F5EE8' },
        { name: 'Tests', glyph: 'T', dye: '#C2366F' },
        { name: 'Router', glyph: 'R', dye: '#4A4740' },
        { name: 'Mail', glyph: 'M', dye: '#1E7F86' },
        { name: 'Notes', glyph: 'N', dye: '#B86E00' },
        { name: 'Docs', glyph: 'D', dye: '#1E8A4C' }
      ],
      reading: [
        { title: 'How the compositor draws a frame', meta: 'Saved this morning · 8 min', knot: '#3F5EE8', ring: '#3F5EE8' },
        { title: 'TFS4: the plan', meta: 'Saved yesterday · 14 min', knot: '#FCFBF8', ring: '#8A857B' },
        { title: 'Notes on virtio-sound', meta: 'Read · Monday', knot: '#FCFBF8', ring: '#DDD6C9' }
      ]
    };
  }
}
</script>
</body>
</html>
