# Menu rozruchowe ProtonOS (GRUB, obraz ISO)
#
# Domyslnie system wchodzi prosto na pulpit graficzny. Druga pozycja
# zostawia konsole tekstowa - przydaje sie, gdy karta nie daje VESA
# albo gdy chcemy patrzec na komunikaty jadra.
#
# insmod all_video wciaga sterowniki obrazu - pod UEFI jest to efi_gop,
# jedyna droga do bufora obrazu, bo trybu tekstowego VGA tam nie ma.
#
# gfxpayload=keep znaczy: zostaw tryb, ktory ustawilo firmware. Na
# laptopie jest to rozdzielczosc wlasna panelu, i o to chodzi - jadro
# nie prosi juz o zaden konkretny tryb, bo prosba WYGRYWALA z tym
# ustawieniem i kazala ekranowi 1920x1080 pracowac w 1024x768.
insmod all_video
set gfxpayload=keep

set timeout=3
set default=0

menuentry "ProtonOS (pulpit graficzny)" {
    multiboot2 /boot/protonos.bin
    module2 /boot/initrd.img
}

menuentry "ProtonOS (konsola tekstowa)" {
    multiboot2 /boot/protonos.bin nodesktop
    module2 /boot/initrd.img
}
