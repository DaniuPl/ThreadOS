# ThreadOS boot menu (GRUB, the ISO image)
#
# By default the system goes straight to the graphical desktop. The
# second entry leaves the text console - useful when the card will not
# give us VESA, or when one wants to look at the kernel's messages.
#
# 'insmod all_video' pulls in the graphics drivers - under UEFI that is
# efi_gop, the only way to a framebuffer there, because UEFI has no VGA
# text mode at all.
#
# gfxpayload=keep means: leave the mode the firmware set. On a laptop
# that is the panel's own resolution, and that is the point - the kernel
# no longer asks for any particular mode, because the asking WON over
# that setting and made a 1920x1080 screen work in 1024x768.
insmod all_video
set gfxpayload=keep

set timeout=3
set default=0

menuentry "ThreadOS (graphical desktop)" {
    multiboot2 /boot/threados.bin
    module2 /boot/initrd.img
}

menuentry "ThreadOS (text console)" {
    multiboot2 /boot/threados.bin nodesktop
    module2 /boot/initrd.img
}
