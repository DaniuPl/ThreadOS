<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome: your profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2; display: flex; flex-direction: column; align-items: center; padding-top: 44px; box-sizing: border-box">
  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
    <path d="M -40 820 C 300 720, 520 900, 820 760 S 1240 600, 1500 650" stroke="{{dye}}" stroke-opacity="0.5" stroke-width="3"></path>
    <path d="M -40 860 C 260 800, 560 920, 860 800 S 1260 680, 1500 720" stroke="#2EC4C4" stroke-opacity="0.25" stroke-width="2"></path>
  </svg>

  <nav aria-label="Setup steps" style="position: relative; display: flex; width: 640px">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
      <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: {{st.line}}"></div>
        <span style="position: relative; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: {{st.fill}}; border: 2px solid {{st.ring}}"></span>
        <span style="font-size: 12px; color: {{st.fg}}; font-weight: {{st.weight}}">{{st.label}}</span>
      </div>
    </sc-for>
  </nav>

  <div style="position: relative; margin-top: 44px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.03em">Make it yours</h1>
    <p style="margin: 0; font-size: 16px; color: #B4B9C6; line-height: 1.5">A profile keeps your files, settings and colour apart from anyone else's on this computer.</p>
  </div>

  <div style="position: relative; margin-top: 30px; display: grid; grid-template-columns: 520px 400px; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; color: #B4B9C6">Profile name</span><input value="Alex" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 9px 9px 4px 4px; border: 0; border-bottom: 2px solid {{dye}}; background: #20232B; color: #ECEDF2; font: 400 15px Inter, sans-serif; outline: none"></label>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; color: #B4B9C6">Login name</span><input value="alex" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 9px 9px 4px 4px; border: 0; border-bottom: 2px dashed #3A3F4C; background: #1B1D24; color: #ECEDF2; font: 400 15px Inter, sans-serif; outline: none"></label>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; color: #B4B9C6">Password (you can leave it empty)</span><input type="password" value="loom-and-thread" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 9px 9px 4px 4px; border: 0; border-bottom: 2px dashed #3A3F4C; background: #1B1D24; color: #ECEDF2; font: 400 15px Inter, sans-serif; outline: none"></label>
        <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12.5px; color: #B4B9C6">Once more</span><input type="password" value="loom-and-thread" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 9px 9px 4px 4px; border: 0; border-bottom: 2px dashed #3A3F4C; background: #1B1D24; color: #ECEDF2; font: 400 15px Inter, sans-serif; outline: none"></label>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #7AD69B"><span style="width: 6px; height: 6px; border-radius: 50%; background: #46C27A"></span>The two match</div>

      <div style="border-top: 1px dashed #2E323D"></div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 14px; font-weight: 600">Your thread</span>
        <div role="radiogroup" aria-label="Thread colour" style="display: flex; gap: 14px">
          <sc-for list="{{dyes}}" as="d" hint-placeholder-count="6">
            <button role="radio" aria-checked="{{d.checked}}" aria-label="{{d.name}}" onClick="{{d.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; color: {{d.label}}; font: 500 12px Inter, sans-serif">
              <span style="width: 38px; height: 38px; box-sizing: border-box; border-radius: 50%; border: 3px solid {{d.ring}}; padding: 3px"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: {{d.hex}}"></span></span>{{d.name}}
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 14px; font-weight: 600">Light</span>
        <div role="group" aria-label="Theme" style="display: inline-flex; padding: 3px; border-radius: 9px; background: #1B1D24; border: 1px solid #2E323D">
          <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
            <button onClick="{{t.pick}}" style="height: 30px; padding: 0 14px; border-radius: 6px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: 600 13px Inter, sans-serif; box-shadow: {{t.shadow}}">{{t.name}}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- what it will look like: the lock screen with this profile -->
    <div aria-label="Preview" style="position: relative; height: 420px; border-radius: 16px; overflow: hidden; background: {{pv.ground}}; border: 1px solid {{pv.line}}">
      <svg aria-hidden="true" width="400" height="420" viewBox="0 0 400 420" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
        <path d="M -10 300 C 80 250, 140 340, 220 280 S 340 220, 410 240" stroke="{{dye}}" stroke-width="3" stroke-opacity="0.8"></path>
        <path d="M -10 330 C 90 290, 150 360, 230 310 S 340 260, 410 270" stroke="#D152A6" stroke-width="1.5" stroke-opacity="0.45"></path>
      </svg>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 44px; gap: 6px">
        <div style="font-size: 13px; color: {{pv.dim}}">Thursday, 19 November</div>
        <div style="font-size: 56px; font-weight: 800; letter-spacing: -0.04em; color: {{pv.text}}; line-height: 1">12:36</div>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px">
        <span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 50%; border: 3px solid {{dye}}; padding: 3px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: {{dye}}; align-items: center; justify-content: center; color: #FFFFFF; font-size: 22px; font-weight: 800">A</span></span>
        <span style="font-size: 16px; font-weight: 700; color: {{pv.text}}">Alex</span>
        <span style="display: flex; align-items: center; width: 220px; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 9px 9px 4px 4px; background: {{pv.field}}; border-bottom: 2px solid {{dye}}; font-size: 13px; color: {{pv.dim}}">Password</span>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; gap: 12px">
    <a href="Welcome2.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 11px; border: 1px solid #2E323D; background: #20232B; color: #ECEDF2; font: 500 15px Inter, sans-serif; text-decoration: none">Back</a>
    <a href="Styles.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 28px; border-radius: 11px; background: #5B7CFA; color: #FFFFFF; font: 600 15px Inter, sans-serif; text-decoration: none">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 2;
    const steps = ['Language', 'Network', 'You', 'Style', 'Ready'].map((label, i) => ({
      label,
      line: i === 0 ? 'transparent' : (i <= cur ? '#5B7CFA' : '#2E323D'),
      fill: i <= cur ? '#5B7CFA' : '#0D0F15',
      ring: i <= cur ? '#5B7CFA' : '#4A4F5C',
      fg: i === cur ? '#FFFFFF' : (i < cur ? '#B4B9C6' : '#6A7080'),
      weight: i === cur ? 700 : 500
    }));
    const st = this.state || {};
    const pickedDye = st.dye || 'Indigo';
    const theme = st.theme || 'Night';
    const list = [['Indigo', '#5B7CFA'], ['Woad', '#2EC4C4'], ['Weld', '#46C27A'], ['Saffron', '#F5A524'], ['Madder', '#E5484D'], ['Cochineal', '#D152A6']];
    const dye = list.find((d) => d[0] === pickedDye)[1];
    const dyes = list.map((d) => ({
      name: d[0], hex: d[1],
      checked: d[0] === pickedDye ? 'true' : 'false',
      ring: d[0] === pickedDye ? '#FFFFFF' : 'transparent',
      label: d[0] === pickedDye ? '#FFFFFF' : '#9AA0AE',
      pick: () => this.setState({ dye: d[0] })
    }));
    const themes = ['Night', 'Linen', 'Follow the sun'].map((t) => ({
      name: t,
      bg: t === theme ? '#2A2D36' : 'transparent',
      fg: t === theme ? '#FFFFFF' : '#B4B9C6',
      shadow: t === theme ? 'inset 0 -2px 0 ' + dye : 'none',
      pick: () => this.setState({ theme: t })
    }));
    const light = theme === 'Linen';
    const pv = light
      ? { ground: '#E6E1D6', line: '#D3CCBE', text: '#1D1C1A', dim: '#6B675F', field: '#FAF8F4' }
      : { ground: '#0D0F15', line: '#2E323D', text: '#ECEDF2', dim: '#9AA0AE', field: '#1B1D24' };
    return { steps, dye, dyes, themes, pv };
  }
}
</script>
</body>
</html>
