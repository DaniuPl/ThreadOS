# clang on ThreadOS: what a ThreadOS program is (apps/clang/threados.cfg)
#
# Installed beside the compiler as x86_64-unknown-linux-musl.cfg, the
# name of the target clang was built for (the Makefile's clang rules),
# which clang reads before every command line. The system is Linux as
# far as the compiler is concerned - musl answers Linux's calls
# (libc/overlay/) - so what differs is said here, as libc/threados-cc.in
# says it to the host's gcc:
#
#   static, since there is no dynamic linker; at the address the linker
#   script gives a program, and not position-independent, since the
#   kernel loads programs where they were linked (kernel64/elf64.c)
-static
-fno-pic
#   no red zone, as the C library and every other program are built;
#   no unwind tables, which the linker script discards
-mno-red-zone
-fno-asynchronous-unwind-tables
-fno-unwind-tables
#   the linker script beside the C library: the address, a page each to
#   code, constants and data, and the thread-local storage symbols
#   musl's start-up reads (libc/libc64.ld)
-Wl,-T,<CFGDIR>/../lib/threados.ld
-Wl,-z,max-page-size=0x1000
-Wl,--build-id=none
#   no RELRO, which clang asks for on Linux: it is for the dynamic
#   linker's tables, and lld will not have .tdata - after .data in the
#   script - among the sections it would make read-only
-Wl,-z,norelro
