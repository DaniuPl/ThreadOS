<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar, linen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3F5EE8}a:hover{color:#2A45C0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #E6E1D6; font-family: Inter, system-ui, sans-serif; color: #1D1C1A">
  <section aria-label="Calendar window" style="position: absolute; left: 16px; top: 14px; width: 1408px; height: 800px; border-radius: 10px; overflow: hidden; background: #FAF8F4; border: 1px solid #D3CCBE; box-shadow: 0 22px 56px rgba(60,50,30,0.22); display: flex; flex-direction: column">
    <div style="height: 3px; background: #3F5EE8"></div>
    <div style="height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; background-color: #EDE8DE; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.022) 0px, rgba(0,0,0,0.022) 1px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px)">
      <div style="width: 18px; height: 18px; border-radius: 5px; background: #C9302C; color: #FFFFFF; font: 800 10px Inter, sans-serif; display: flex; align-items: center; justify-content: center">19</div>
      <div style="font-size: 13px; font-weight: 700">Calendar</div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(0,0,0,0.05)">
        <button aria-label="Minimise" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4A4740" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
        <button aria-label="Maximise" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#4A4740" stroke-width="2.4" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
        <button aria-label="Close" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(201,48,44,0.12); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C9302C" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </div>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex">
      <aside style="width: 248px; box-sizing: border-box; padding: 16px; border-right: 1px solid #E3DDD1; background: #F6F3EC; display: flex; flex-direction: column; gap: 18px">
        <button style="height: 38px; border-radius: 10px; border: 0; background: #3F5EE8; color: #FFFFFF; font: 600 14px Inter, sans-serif">New event</button>
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; margin-bottom: 8px">November 2026<span style="font-weight: 500; color: #6B675F; font-size: 13px">‹ ›</span></div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px; text-align: center; font-size: 12px">
            <sc-for list="{{dow}}" as="d" hint-placeholder-count="7"><span style="color: #8A857B; font-weight: 600">{{d}}</span></sc-for>
            <sc-for list="{{month}}" as="m" hint-placeholder-count="35">
              <span style="height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.weight}}">{{m.n}}</span>
            </sc-for>
          </div>
        </div>
        <div style="border-top: 1px dashed #DDD6C9"></div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B675F">Calendars</div>
          <sc-for list="{{cals}}" as="c" hint-placeholder-count="4">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13.5px"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{c.dye}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>{{c.name}}</label>
          </sc-for>
        </div>
      </aside>

      <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
        <div style="height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid #E3DDD1">
          <h1 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em">16 – 22 November</h1>
          <button style="height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid #DDD6C9; background: #FCFBF8; color: #1D1C1A; font: 500 13px Inter, sans-serif">Today</button>
          <div style="flex-grow: 1"></div>
          <div role="group" aria-label="View" style="display: inline-flex; padding: 3px; border-radius: 9px; background: #EFEBE3; border: 1px solid #DDD6C9">
            <button style="height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #4A4740; font: 500 13px Inter, sans-serif">Day</button>
            <button style="height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: #FCFBF8; color: #1D1C1A; font: 600 13px Inter, sans-serif; box-shadow: inset 0 -2px 0 #3F5EE8">Week</button>
            <button style="height: 28px; padding: 0 12px; border-radius: 6px; border: 0; background: transparent; color: #4A4740; font: 500 13px Inter, sans-serif">Month</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); border-bottom: 1px solid #E3DDD1">
          <span></span>
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; border-left: 1px dashed #E3DDD1">
              <span style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 12px; color: #6B675F; font-weight: 600">{{d.name}}</span><span style="width: 28px; height: 28px; border-radius: 50%; background: {{d.bg}}; color: {{d.fg}}; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{d.n}}</span></span>
              <span style="height: 20px; border-radius: 5px; background: {{d.allBg}}; color: #6E4500; font-size: 11.5px; font-weight: 600; padding: 0 6px; display: flex; align-items: center; white-space: nowrap; overflow: hidden">{{d.all}}</span>
            </div>
          </sc-for>
        </div>

        <div style="position: relative; flex-grow: 1; display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); overflow: hidden">
          <div style="display: flex; flex-direction: column">
            <sc-for list="{{hours}}" as="h" hint-placeholder-count="11"><span style="height: 52px; box-sizing: border-box; padding: 0 8px; text-align: right; font-size: 11px; color: #8A857B; transform: translateY(-7px)">{{h}}</span></sc-for>
          </div>
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <div style="position: relative; border-left: 1px dashed #E3DDD1; background-image: repeating-linear-gradient(180deg, #ECE7DD 0px, #ECE7DD 1px, transparent 1px, transparent 52px); background-color: {{d.col}}">
              <sc-for list="{{d.events}}" as="e" hint-placeholder-count="2">
                <a href="#" style="position: absolute; left: 4px; right: 4px; top: {{e.top}}; height: {{e.h}}; box-sizing: border-box; border-radius: 7px; overflow: hidden; background: {{e.tint}}; text-decoration: none; color: #1D1C1A; display: flex; flex-direction: column">
                  <span style="height: 3px; background: {{e.dye}}; flex-shrink: 0"></span>
                  <span style="padding: 4px 8px; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12.5px; font-weight: 700; line-height: 1.25">{{e.title}}</span><span style="font-size: 11px; color: #4A4740">{{e.time}}</span></span>
                </a>
              </sc-for>
            </div>
          </sc-for>
          <!-- now: a thread across today -->
          <div style="position: absolute; left: {{nowLeft}}; width: {{colW}}; top: {{nowTop}}; height: 2px; background: #3F5EE8"></div>
          <div style="position: absolute; left: {{nowLeft}}; top: {{nowTop}}; width: 10px; height: 10px; margin: -4px 0 0 -5px; border-radius: 50%; background: #3F5EE8"></div>
        </div>
      </main>
    </div>
  </section>

  <nav aria-label="Loom" style="position: absolute; left: 16px; right: 16px; bottom: 14px; height: 58px; box-sizing: border-box; border-radius: 14px; background-color: #FAF8F4; background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.022) 0px, rgba(0,0,0,0.022) 1px, transparent 1px, transparent 3px); border: 1px solid #D3CCBE; display: flex; align-items: center; padding: 0 10px; gap: 14px">
    <span style="width: 40px; height: 40px; border-radius: 10px; background: #3F5EE8"></span>
    <div style="flex-grow: 1; display: flex; justify-content: center; gap: 10px"><span style="width: 38px; height: 38px; border-radius: 10px; background: #3F5EE8"></span><span style="width: 38px; height: 38px; border-radius: 10px; background: #1E7F86"></span><span style="position: relative; width: 38px; height: 38px; border-radius: 10px; background: #C9302C"><span style="position: absolute; left: 4px; right: 4px; bottom: -10px; height: 3px; border-radius: 2px; background: #3F5EE8"></span></span><span style="width: 38px; height: 38px; border-radius: 10px; background: #B86E00"></span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; padding: 0 6px 0 12px; border-left: 1px dashed #D3CCBE; line-height: 1.15"><div style="font-size: 15px; font-weight: 700">12:36</div><div style="font-size: 11px; color: #6B675F">Thu 19 Nov</div></div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 52, START = 8;
    const cal = { work: ['Work', '#3F5EE8', 'rgba(63,94,232,0.12)'], home: ['Home', '#C9302C', 'rgba(201,48,44,0.10)'], tos: ['ThreadOS', '#1E7F86', 'rgba(30,127,134,0.12)'], bday: ['Birthdays', '#B86E00', 'rgba(184,110,0,0.14)'] };
    const ev = [
      [0, 9, 1, 'Stand-up', 'work'], [0, 13, 2, 'Weave: shuttle states', 'tos'],
      [1, 10, 1.5, 'Kernel review', 'work'],
      [2, 8.5, 1, 'Gym', 'home'], [2, 14, 2, 'QEMU test run', 'tos'],
      [3, 9, 1, 'Stand-up', 'work'], [3, 11, 1.5, 'Design review: Weave', 'tos'], [3, 17, 1, 'Tea with Ania', 'home'],
      [4, 10, 2, 'Release 0.1.0-alpha', 'tos'], [4, 15, 1, 'Week notes', 'work'],
      [5, 10, 3, 'Market', 'home']
    ];
    const fmt = (t) => { const h = Math.floor(t); const m = Math.round((t - h) * 60); return h + ':' + (m < 10 ? '0' : '') + m; };
    const names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const days = names.map((name, i) => ({
      name, n: 16 + i,
      bg: i === 3 ? '#3F5EE8' : 'transparent', fg: i === 3 ? '#FFFFFF' : '#1D1C1A',
      col: i === 3 ? 'rgba(63,94,232,0.04)' : (i >= 5 ? 'rgba(0,0,0,0.015)' : 'transparent'),
      all: i === 6 ? 'Ola’s birthday' : '', allBg: i === 6 ? cal.bday[2] : 'transparent',
      events: ev.filter((e) => e[0] === i).map((e) => ({ title: e[3], time: fmt(e[1]) + ' – ' + fmt(e[1] + e[2]), top: ((e[1] - START) * H + 2) + 'px', h: (e[2] * H - 4) + 'px', dye: cal[e[4]][1], tint: cal[e[4]][2] }))
    }));
    const hours = []; for (let h = START; h <= 18; h++) hours.push(h === START ? '' : h + ':00');
    const dow = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const month = [];
    for (let k = 0; k < 6; k++) month.push({ n: 26 + k, bg: 'transparent', fg: '#B3AC9F', weight: 400 });
    for (let d = 1; d <= 29; d++) month.push({ n: d, bg: d === 19 ? '#3F5EE8' : (d >= 16 && d <= 22 ? 'rgba(63,94,232,0.12)' : 'transparent'), fg: d === 19 ? '#FFFFFF' : '#1D1C1A', weight: d === 19 ? 700 : 400 });
    const cals = Object.keys(cal).map((k) => ({ name: cal[k][0], dye: cal[k][1] }));
    const now = 12 + 36 / 60;
    return { days, hours, dow, month, cals, nowTop: ((now - START) * H) + 'px', nowLeft: 'calc(56px + (100% - 56px) * 3 / 7)', colW: 'calc((100% - 56px) / 7)' };
  }
}
</script>
</body>
</html>
