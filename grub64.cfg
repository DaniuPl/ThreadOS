# Boot menu for the 64-bit kernel (one disc for BIOS and for UEFI)
#
# 'insmod all_video' pulls in the graphics drivers - under UEFI that is
# efi_gop, the only way to a framebuffer there, because UEFI has no VGA
# text mode at all.
#
# The first entry goes straight to the desktop ('desktop' on the kernel's
# line); the second straight to the installer ('install'); the third
# stays at the shell, which is where the kernel's messages can be read.
#
# Every entry hands over two more modules than the system needs to run:
# the kernel's own file and threadboot, our EFI loader. They are what
# the installer writes onto a disk (kernel/install.c looks for them by
# these names, as threadboot names them) - without them a system
# started from this disc would have nothing to install itself from.
insmod all_video
set gfxpayload=keep

set timeout=2
set default=0

menuentry "ThreadOS 64 (desktop)" {
    multiboot2 /boot/threados64.bin desktop
    module2 /boot/initrd64.img initrd64
    module2 /boot/threados64.bin the kernel
    module2 /boot/threadboot.efi loader
}

menuentry "Install ThreadOS onto this computer's disk" {
    multiboot2 /boot/threados64.bin install
    module2 /boot/initrd64.img initrd64
    module2 /boot/threados64.bin the kernel
    module2 /boot/threadboot.efi loader
}

menuentry "ThreadOS 64 (shell)" {
    multiboot2 /boot/threados64.bin
    module2 /boot/initrd64.img initrd64
    module2 /boot/threados64.bin the kernel
    module2 /boot/threadboot.efi loader
}
