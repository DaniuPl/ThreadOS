<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: a call</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
    <circle cx="195" cy="280" r="110" stroke="#D152A6" stroke-opacity="{{ring1}}" stroke-width="2"></circle>
    <circle cx="195" cy="280" r="150" stroke="#D152A6" stroke-opacity="{{ring2}}" stroke-width="1.5" stroke-dasharray="3 6"></circle>
  </svg>
  <div style="position: relative; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">12:36</div>
  <div style="position: relative; padding-top: 110px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span style="width: 120px; height: 120px; box-sizing: border-box; border-radius: 50%; border: 4px solid #D152A6; padding: 6px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: #D152A6; align-items: center; justify-content: center; font-size: 44px; font-weight: 800">N</span></span>
    <span style="font-size: 32px; font-weight: 800; margin-top: 20px">Ania</span>
    <span style="font-size: 15px; color: #B4B9C6">{{state}}</span>
  </div>

  <sc-if value="{{ringing}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 110px; display: flex; justify-content: space-around; padding: 0 30px">
      <button style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #ECEDF2; font: 500 13px Inter, sans-serif"><span style="width: 72px; height: 72px; border-radius: 50%; background: #E5484D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" transform="rotate(135)"><path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></span>Not now</button>
      <button onClick="{{answer}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #ECEDF2; font: 500 13px Inter, sans-serif"><span style="width: 72px; height: 72px; border-radius: 50%; background: #46C27A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"><path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></span>Answer</button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font-size: 13px; color: #8A90A0">Reply with a message instead</div>
  </sc-if>
  <sc-if value="{{talking}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 30px; right: 30px; bottom: 210px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 18px">
      <sc-for list="{{controls}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.toggle}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: transparent; color: #ECEDF2; font: 500 12.5px Inter, sans-serif"><span style="width: 64px; height: 64px; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">{{c.glyph}}</span>{{c.name}}</button>
      </sc-for>
    </div>
    <button onClick="{{hang}}" style="position: absolute; left: 50%; bottom: 90px; margin-left: -36px; width: 72px; height: 72px; border-radius: 50%; border: 0; background: #E5484D; display: flex; align-items: center; justify-content: center; padding: 0" aria-label="End the call"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" transform="rotate(135)"><path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font-size: 12.5px; color: #8A90A0">Go home: the call rides the shuttle, a tap brings it back</div>
  </sc-if>
  <div aria-label="The thread" style="position: absolute; left: 16px; right: 16px; bottom: 6px; height: 22px"><div style="position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3A3F4C"></div><div style="position: absolute; left: 50%; top: 9px; width: 56px; margin-left: -28px; height: 4px; border-radius: 2px; background: #46C27A"></div><div style="position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; justify-content: center; align-items: center"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #46C27A; border: 2px solid #FFFFFF"></span></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const talking = !!st.talk;
    const on = st.on || {};
    const C = [['mute', 'Mute', 'M'], ['keys', 'Keys', '#'], ['speaker', 'Speaker', 'S'], ['add', 'Add', '+'], ['video', 'Video', 'V'], ['hold', 'Hold', 'II']];
    const controls = C.map((c) => { const v = !!on[c[0]]; return { name: c[1], glyph: c[2], bg: v ? '#ECEDF2' : '#1F2229', fg: v ? '#0D0F15' : '#ECEDF2', toggle: () => this.setState({ on: Object.assign({}, on, { [c[0]]: !v }) }) }; });
    return { ringing: !talking, talking, state: talking ? '1:24 · on Purl' : 'calling on Purl', ring1: talking ? 0 : 0.6, ring2: talking ? 0 : 0.35, controls, answer: () => this.setState({ talk: true }), hang: () => this.setState({ talk: false, on: {} }) };
  }
}
</script>
</body>
</html>
