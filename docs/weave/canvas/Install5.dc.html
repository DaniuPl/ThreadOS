<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Install: done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #08090D; font-family: Inter, system-ui, sans-serif; color: #ECEDF2; display: flex; flex-direction: column; align-items: center; padding-top: 30px; box-sizing: border-box">
  <!-- the warp of the first screen, now woven: the same threads, crossed -->
  <svg aria-hidden="true" width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" fill="none">
    <g stroke-width="2">
      <path d="M180 0 V900" stroke="#5B7CFA" stroke-opacity="0.25"></path>
      <path d="M300 0 V900" stroke="#2EC4C4" stroke-opacity="0.18"></path>
      <path d="M1140 0 V900" stroke="#46C27A" stroke-opacity="0.18"></path>
      <path d="M1260 0 V900" stroke="#5B7CFA" stroke-opacity="0.25"></path>
    </g>
    <path d="M -20 700 C 300 640, 520 760, 720 700 S 1160 620, 1460 680" stroke="#5B7CFA" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"></path>
    <path d="M -20 740 C 300 700, 540 800, 720 740 S 1180 680, 1460 720" stroke="#D152A6" stroke-width="2" stroke-opacity="0.45" stroke-linecap="round"></path>
  </svg>
  <div style="position: absolute; left: 32px; top: 30px; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700"><span style="width: 22px; height: 22px; border-radius: 6px; background: #5B7CFA"></span>Install ThreadOS</div>

  <nav aria-label="Install steps" style="position: relative; display: flex; width: 520px">
    <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
      <div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px">
        <div style="position: absolute; top: 7px; right: 50%; width: 100%; height: 2px; background: {{st.line}}"></div>
        <span style="position: relative; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: {{st.fill}}; border: 2px solid {{st.ring}}"></span>
        <span style="font-size: 12px; color: {{st.fg}}; font-weight: {{st.weight}}">{{st.label}}</span>
      </div>
    </sc-for>
  </nav>

  <div style="position: relative; margin-top: 70px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <span style="width: 80px; height: 80px; border-radius: 50%; background: #46C27A; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 50px rgba(70,194,122,0.3)"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
    <h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em">ThreadOS is on this computer</h1>
    <p style="margin: 0; font-size: 16px; color: #B4B9C6; max-width: 600px; line-height: 1.5">It is first in the boot menu, and the other system is right below it. Pull the stick out and restart.</p>
  </div>

  <section aria-label="The boot menu" style="position: relative; margin-top: 34px; width: 520px; padding: 8px; border-radius: 16px; background: #14161B; border: 1px solid #262A33">
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; border-radius: 10px; background: rgba(91,124,250,0.16)">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #5B7CFA"></span>
      <span style="width: 22px; height: 22px; border-radius: 6px; background: #5B7CFA"></span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700">ThreadOS</span>
      <span style="font-size: 12px; color: #8FA5FF">starts first</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px 0 32px">
      <span style="width: 22px; height: 22px; border-radius: 6px; background: #3A3F4C"></span>
      <span style="flex-grow: 1; font-size: 15px; color: #C9CDD8">Another system</span>
      <span style="font-size: 12px; color: #8A90A0">untouched</span>
    </div>
  </section>

  <div style="position: relative; margin-top: 18px; font-size: 13px; color: #8A90A0">Nothing of anybody else's was touched.</div>

  <div style="position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; gap: 12px">
    <a href="Install1.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 11px; border: 1px solid #2E323D; background: #20232B; color: #ECEDF2; font: 500 15px Inter, sans-serif; text-decoration: none">Keep trying it</a>
    <a href="Welcome1.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 28px; border-radius: 11px; background: #5B7CFA; color: #FFFFFF; font: 700 15px Inter, sans-serif; text-decoration: none">Restart now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 3;
    const steps = ['Where', 'Check', 'Write', 'Done'].map((label, i) => ({
      label,
      line: i === 0 ? 'transparent' : (i <= cur ? '#5B7CFA' : '#2E323D'),
      fill: i <= cur ? '#5B7CFA' : '#08090D',
      ring: i <= cur ? '#5B7CFA' : '#4A4F5C',
      fg: i === cur ? '#FFFFFF' : (i < cur ? '#B4B9C6' : '#6A7080'),
      weight: i === cur ? 700 : 500
    }));
    return { steps };
  }
}
</script>
</body>
</html>
