<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone welcome: ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" fill="none" stroke-linecap="round">
    <path d="M -20 640 C 80 600, 150 690, 195 660 S 330 580, 420 600" stroke="#5B7CFA" stroke-opacity="0.7" stroke-width="3"></path>
    <path d="M -20 700 C 90 660, 160 660, 195 660 S 330 650, 420 670" stroke="#2EC4C4" stroke-opacity="0.45" stroke-width="2"></path>
    <path d="M -20 590 C 90 600, 160 640, 195 660 S 320 540, 420 540" stroke="#D152A6" stroke-opacity="0.4" stroke-width="2"></path>
    <circle cx="195" cy="660" r="6" fill="#FFFFFF"></circle>
  </svg>
  <div style="position: relative; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">12:40</div>
  <nav aria-label="Step 5 of 5" style="position: relative; display: flex; justify-content: center; align-items: center; margin-top: 4px">
    <sc-for list="{{knots}}" as="k" hint-placeholder-count="5">
      <span style="display: flex; align-items: center"><span style="width: {{k.gapW}}; height: 2px; background: {{k.line}}"></span><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; background: {{k.fill}}; border: 2px solid {{k.ring}}"></span></span>
    </sc-for>
  </nav>

  <div style="position: relative; padding: 48px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
    <span style="width: 88px; height: 88px; box-sizing: border-box; border-radius: 50%; border: 3px solid #5B7CFA; padding: 4px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: #5B7CFA; align-items: center; justify-content: center; font-size: 32px; font-weight: 800">A</span></span>
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">All set, Alex</h1>
  </div>

  <div style="position: relative; margin: 26px 20px 0; padding: 6px 16px 6px 38px; border-radius: 18px; background: #14161B; border: 1px solid #262A33">
    <div style="position: absolute; left: 20px; top: 26px; bottom: 26px; width: 2px; background: #5B7CFA"></div>
    <sc-for list="{{summary}}" as="s" hint-placeholder-count="4">
      <div style="position: relative; display: flex; align-items: center; height: 48px">
        <span style="position: absolute; left: -23px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; background: #5B7CFA; border: 2px solid #14161B"></span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 12px; color: #8A90A0">{{s.what}}</span><span style="display: block; font-size: 15px; font-weight: 600">{{s.value}}</span></span>
        <a href="{{s.href}}" style="font-size: 14px; text-decoration: none">Change</a>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <a href="Phone.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #5B7CFA; color: #FFFFFF; font: 700 17px Inter, sans-serif; text-decoration: none; box-shadow: 0 12px 30px rgba(91,124,250,0.35)">Start ThreadOS</a>
  </div>
  <!-- the thread: the phone's navigation, every running program a knot -->
  <div aria-label="The thread" style="position: absolute; left: 16px; right: 16px; bottom: 6px; height: 22px">
    <div style="position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3A3F4C"></div>
    <div style="position: absolute; left: 50%; top: 9px; width: 56px; margin-left: -28px; height: 4px; border-radius: 2px; background: #5B7CFA"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; justify-content: center; align-items: center; gap: 16px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #5B7CFA; border: 2px solid #FFFFFF"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 4;
    const knots = [0, 1, 2, 3, 4].map((i) => ({ gapW: i === 0 ? '0px' : '28px', line: i <= cur ? '#5B7CFA' : '#2E323D', fill: i <= cur ? '#5B7CFA' : '#0D0F15', ring: i <= cur ? '#5B7CFA' : '#4A4F5C' }));
    const summary = [
      { what: 'Language', value: 'English', href: 'M1.dc.html' },
      { what: 'Network', value: 'Home-5G', href: 'M2.dc.html' },
      { what: 'Unlock', value: 'Alex, with a PIN', href: 'M3.dc.html' },
      { what: 'Thread and light', value: 'Indigo · Night', href: 'M3.dc.html' },
      { what: 'Getting around', value: 'The thread', href: 'M4.dc.html' }
    ];
    return { knots, summary };
  }
}
</script>
</body>
</html>
