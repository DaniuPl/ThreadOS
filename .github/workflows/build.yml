# Building the kernels and running the tests that matter most.
#
# By hand only. The project is built and tested locally, in QEMU - the
# full suite is a hundred virtual machines, twenty minutes on four cores
# with KVM and a great deal longer on a runner with two and none, and
# it is run before every push anyway. This stays for whoever wants a
# second opinion from a clean machine: Actions -> build and test ->
# Run workflow. Without the 'schedule' event the "everything" step
# below never fires; the curated list runs instead.
name: build and test

on:
  workflow_dispatch:

# Ubuntu 24.04, not ubuntu-latest: from 26.04 on, Ubuntu's whole archive
# - GCC's defaults, libgcc and libstdc++, which every C++ program links
# - is built for x86-64-v3 (Haswell), and what came out of it stopped on
# a real machine with Invalid Opcode (scripts/checkisa.py). 24.04's is
# the toolchain the system is built and tested with.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install what the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            clang lld python3 cmake ninja-build ruby pkg-config gperf \
            libglib2.0-dev-bin
          # (cmake, ninja and ruby build WebKit's JavaScriptCore;
          # meson and pkg-config build GLib - meson from pip, since
          # GLib wants a newer one than the runner's; gperf makes
          # fontconfig's object table; libglib2.0-dev-bin has
          # glib-mkenums, which libsoup's build runs on the host)
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The kernel and its initrd
        run: make -j$(nproc)

      - name: threadboot - our own EFI loader
        run: make efi

      - name: The ARM64 kernel (QEMU virt)
        run: make kernelarm64

      - name: The hybrid disc (BIOS + UEFI)
        run: make iso64

      - name: A bootable USB image
        run: make stick

      - name: What came out
        run: ls -la build/*.bin build/*.img build/*.iso build/BOOTX64.EFI

  test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install what the tests need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            qemu-system-x86 qemu-system-arm grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools ovmf clang lld python3 openssl libssl-dev \
            acpica-tools qemu-system-gui cmake ninja-build ruby \
            pkg-config gperf libglib2.0-dev libfontconfig-dev \
            libfreetype-dev python3-pil
          # (iasl, from acpica-tools, compiles the batteries t_power
          # gives the machine; qemu-system-gui has QEMU's SDL sound,
          # whose disk driver is t_mic's microphone; t_glib holds
          # ThreadOS's GLib to the runner's, t_fontconfig its fontconfig
          # and FreeType, and t_images its pictures to Pillow's)
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # FreeType and fontTools are what the TrueType test compares
          # the kernel's glyphs with; h2 is the HTTP/2 server t_soup
          # stands up for libsoup
          python3 -m pip install --user freetype-py fonttools h2

      - name: Build everything the tests boot
        run: |
          make -j$(nproc)
          make efi
          make kernelarm64

      # The network groups stand a DNS server of their own on the
      # host's port 53, because that is where QEMU's user network sends
      # the guest's questions and there is no way to remap it. A runner
      # is not root, so it needs this one line - without it those groups
      # say why they are giving up, and the coverage is simply lost.
      - name: Let an unprivileged process bind port 53
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=53

      # A cross-section rather than everything: booting the kernels,
      # ring 3, the filesystem, the disc, the two authenticated ciphers,
      # WPA2, USB storage, the sound card, the desktop and the network.
      # The first run of this took six minutes on a runner with two
      # cores and no KVM, which is why the list is this long rather
      # than half of it - a failure here means something real is
      # broken, and finding it now is cheaper than finding it at night.
      - name: The groups that cover the most ground
        if: github.event_name != 'schedule'
        run: |
          make test J=2 T=k64core,k64shell,k64proc,k64disk,tfs,arm64boot,arm64core,arm64threads,libc,pthread,sqlite,socket,ipc,glib,images,xml,fontconfig,soup,isa,hostile,fat,aes,wpa,bt,usbdisk,usbnet,sound,xhci,ehci,ttf,uefi,threadboot,http,tls64,net64,desktop64,files,ginstal,stick,power

      - name: Everything, once a night
        if: github.event_name == 'schedule'
        run: make test J=2

      - name: The serial logs, when something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: /tmp/*.log
          if-no-files-found: ignore
