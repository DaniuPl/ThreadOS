# A ThreadOS release - what 'update' installs - when one is asked for:
# Actions -> release -> Run workflow. Not after every push: a release is
# a whole build of the system, its disc and stick image, on GitHub's
# machines, and most pushes are not something to hand to installed
# systems. The run number still only grows, so updates stay in order.
#
# Releases remain 0.x pre-releases until ThreadOS is ready for daily use.
# The SemVer label is shown in Settings; the monotonically increasing run
# number is kept separately to order signed updates. The release carries
# the three files an installed system is made of, update.txt saying what
# they are and signing all of it (scripts/mkupdate.py), the disc and
# stick image for a new machine, and LICENSES.txt - the licences of the
# libraries linked into them, which the LGPL among others asks to hand
# out with the binaries (docs/LICENSING.md). GitHub's "Source code"
# archive of the release's tag is the source those licences ask for.
#
# The signature is made with the private key in the repository secret
# THREADOS_UPDATE_KEY (a P-256 key in PEM - Settings -> Secrets and
# variables -> Actions). Its public half is built into user/update.c,
# and a system takes nothing that key did not sign. Without the secret
# this workflow stops before publishing anything.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Ubuntu 24.04, not ubuntu-latest: from 26.04 on, Ubuntu's archive -
    # GCC's defaults, libgcc and libstdc++ - is built for x86-64-v3, and
    # alpha.84 built on it stopped a laptop's installer with Invalid
    # Opcode. The 'Only the first x86-64' step below holds the images
    # to that, whatever runner they come from.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install what the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            clang lld python3 openssl xz-utils cmake ninja-build ruby \
            pkg-config gperf libglib2.0-dev-bin bison
          python3 -m pip install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build 0.1.0-alpha.${{ github.run_number }}
        run: |
          VERSION_LABEL="0.1.0-alpha.${{ github.run_number }}"
          make -j$(nproc) VERSION=${{ github.run_number }} \
            VERSION_LABEL="$VERSION_LABEL" \
            build/threados64.bin build/initrd64.img efi
          make VERSION=${{ github.run_number }} \
            VERSION_LABEL="$VERSION_LABEL" iso64 stick
          xz -T0 -9 -k build/threados-stick.img

      # Nothing is published that the first x86-64 processor cannot run
      # (scripts/tests/t_isa.py says why)
      - name: Only the first x86-64's instructions
        run: python3 scripts/checkisa.py build/threados64.bin build/initrd64.img

      - name: Sign
        env:
          KEY: ${{ secrets.THREADOS_UPDATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::the THREADOS_UPDATE_KEY secret is not set - nothing is published"
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key.pem"
          python3 scripts/mkupdate.py build/update.txt ${{ github.run_number }} \
            "$RUNNER_TEMP/key.pem" \
            build/threados64.bin build/initrd64.img build/BOOTX64.EFI
          rm -f "$RUNNER_TEMP/key.pem"
          cat build/update.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-alpha.${{ github.run_number }}" \
            --title "ThreadOS 0.1.0-alpha.${{ github.run_number }}" \
            --notes "Pre-1.0 alpha release built from ${{ github.sha }}. An installed system takes it with 'sudo run update'; a new machine starts from threados64.iso. LICENSES.txt lists the third-party components the images contain and their licences; the Source code archive below is the complete source they were built from, those components included." \
            --latest \
            build/update.txt build/threados64.bin build/initrd64.img \
            build/BOOTX64.EFI build/threados64.iso build/threados-stick.img.xz \
            build/LICENSES.txt
