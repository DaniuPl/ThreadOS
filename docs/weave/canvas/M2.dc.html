<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone welcome: network</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <div style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">12:37</div>
  <nav aria-label="Step 2 of 5" style="display: flex; justify-content: center; align-items: center; margin-top: 4px">
    <sc-for list="{{knots}}" as="k" hint-placeholder-count="5">
      <span style="display: flex; align-items: center"><span style="width: {{k.gapW}}; height: 2px; background: {{k.line}}"></span><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; background: {{k.fill}}; border: 2px solid {{k.ring}}"></span></span>
    </sc-for>
  </nav>

  <div style="padding: 40px 24px 0; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em">Connect</h1>
    <p style="margin: 0; font-size: 15px; color: #B4B9C6; line-height: 1.5">For the clock, updates and Weft.</p>
  </div>

  <div style="margin: 22px 16px 0; border-radius: 18px; background: #14161B; border: 1px solid #262A33; padding: 6px">
    <sc-for list="{{nets}}" as="n" hint-placeholder-count="4">
      <div style="border-radius: 13px; background: {{n.bg}}">
        <button onClick="{{n.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border: 0; background: transparent; color: #ECEDF2; font: 500 16px Inter, sans-serif; text-align: left">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M3 9a14 14 0 0 1 18 0" stroke="{{n.s3}}"></path><path d="M6 12.5a9 9 0 0 1 12 0" stroke="{{n.s2}}"></path><path d="M9 16a4 4 0 0 1 6 0" stroke="#ECEDF2"></path><circle cx="12" cy="19" r="1" fill="#ECEDF2"></circle></svg>
          <span style="flex-grow: 1; font-weight: {{n.weight}}">{{n.name}}</span>
          <span style="font-size: 12.5px; color: #8A90A0">{{n.sec}}</span>
        </button>
        <sc-if value="{{n.open}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px">
            <input type="password" aria-label="Password for {{n.name}}" value="woven-thread-42" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 11px 11px 4px 4px; border: 0; border-bottom: 2px solid #5B7CFA; background: #20232B; color: #ECEDF2; font: 400 16px Inter, sans-serif; outline: none">
            <button style="height: 46px; border-radius: 12px; border: 0; background: #5B7CFA; color: #FFFFFF; font: 600 15px Inter, sans-serif">Join</button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; gap: 10px">
    <a href="M1.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 16px; border: 1px solid #2E323D; background: #20232B; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEDF2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <a href="M3.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #5B7CFA; color: #FFFFFF; font: 700 16px Inter, sans-serif; text-decoration: none">Continue</a>
  </div>
  <a href="M3.dc.html" style="position: absolute; left: 0; right: 0; bottom: 98px; text-align: center; font-size: 14px; text-decoration: none">Skip for now</a>
  <!-- the thread: the phone's navigation, every running program a knot -->
  <div aria-label="The thread" style="position: absolute; left: 16px; right: 16px; bottom: 6px; height: 22px">
    <div style="position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3A3F4C"></div>
    <div style="position: absolute; left: 50%; top: 9px; width: 56px; margin-left: -28px; height: 4px; border-radius: 2px; background: #5B7CFA"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; justify-content: center; align-items: center; gap: 16px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #5B7CFA; border: 2px solid #FFFFFF"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 1;
    const knots = [0, 1, 2, 3, 4].map((i) => ({ gapW: i === 0 ? '0px' : '28px', line: i <= cur ? '#5B7CFA' : '#2E323D', fill: i <= cur ? '#5B7CFA' : '#0D0F15', ring: i <= cur ? '#5B7CFA' : '#4A4F5C' }));
    const sel = (this.state && this.state.sel) || 'Home-5G';
    const nets = [['Home-5G', 'WPA2', 3], ['Home', 'WPA2', 3], ['Upstairs', 'WPA2', 2], ['Library guest', 'Open', 1]].map((n) => {
      const on = n[0] === sel;
      return { name: n[0], sec: n[1], s3: n[2] >= 3 ? '#ECEDF2' : '#3A3F4C', s2: n[2] >= 2 ? '#ECEDF2' : '#3A3F4C', bg: on ? 'rgba(91,124,250,0.14)' : 'transparent', weight: on ? 700 : 500, open: on && n[1] !== 'Open', pick: () => this.setState({ sel: n[0] }) };
    });
    return { knots, nets };
  }
}
</script>
</body>
</html>
