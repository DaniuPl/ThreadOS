<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone welcome: you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <div style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">12:38</div>
  <nav aria-label="Step 3 of 5" style="display: flex; justify-content: center; align-items: center; margin-top: 4px">
    <sc-for list="{{knots}}" as="k" hint-placeholder-count="5">
      <span style="display: flex; align-items: center"><span style="width: {{k.gapW}}; height: 2px; background: {{k.line}}"></span><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; background: {{k.fill}}; border: 2px solid {{k.ring}}"></span></span>
    </sc-for>
  </nav>

  <div style="padding: 30px 24px 0; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <span style="width: 88px; height: 88px; box-sizing: border-box; border-radius: 50%; border: 3px solid {{dye}}; padding: 4px"><span style="display: flex; width: 100%; height: 100%; border-radius: 50%; background: {{dye}}; align-items: center; justify-content: center; font-size: 32px; font-weight: 800">A</span></span>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">Make it yours</h1>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #B4B9C6">Your name</span><input value="Alex" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px 12px 4px 4px; border: 0; border-bottom: 2px solid {{dye}}; background: #20232B; color: #ECEDF2; font: 400 17px Inter, sans-serif; outline: none"></label>
    <label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; color: #B4B9C6">A PIN to unlock</span><input type="password" value="482913" style="height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 12px 12px 4px 4px; border: 0; border-bottom: 2px dashed #3A3F4C; background: #1B1D24; color: #ECEDF2; font: 700 20px 'JetBrains Mono', monospace; letter-spacing: 0.3em; outline: none"></label>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #B4B9C6">Your thread</span>
      <div role="radiogroup" aria-label="Thread colour" style="display: flex; justify-content: space-between">
        <sc-for list="{{dyes}}" as="d" hint-placeholder-count="6">
          <button role="radio" aria-checked="{{d.checked}}" aria-label="{{d.name}}" onClick="{{d.pick}}" style="width: 48px; height: 48px; box-sizing: border-box; border-radius: 50%; border: 3px solid {{d.ring}}; padding: 4px; background: transparent"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: {{d.hex}}"></span></button>
        </sc-for>
      </div>
    </div>

    <div role="group" aria-label="Light" style="display: flex; padding: 4px; border-radius: 14px; background: #1B1D24; border: 1px solid #2E323D">
      <button style="flex: 1; height: 40px; border-radius: 10px; border: 0; background: #2A2D36; color: #FFFFFF; font: 600 14px Inter, sans-serif; box-shadow: inset 0 -2px 0 {{dye}}">Night</button>
      <button style="flex: 1; height: 40px; border-radius: 10px; border: 0; background: transparent; color: #B4B9C6; font: 500 14px Inter, sans-serif">Linen</button>
      <button style="flex: 1; height: 40px; border-radius: 10px; border: 0; background: transparent; color: #B4B9C6; font: 500 14px Inter, sans-serif">By the sun</button>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; gap: 10px">
    <a href="M2.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 16px; border: 1px solid #2E323D; background: #20232B; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEDF2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <a href="M4.dc.html" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #5B7CFA; color: #FFFFFF; font: 700 16px Inter, sans-serif; text-decoration: none">Continue</a>
  </div>
  <!-- the thread: the phone's navigation, every running program a knot -->
  <div aria-label="The thread" style="position: absolute; left: 16px; right: 16px; bottom: 6px; height: 22px">
    <div style="position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3A3F4C"></div>
    <div style="position: absolute; left: 50%; top: 9px; width: 56px; margin-left: -28px; height: 4px; border-radius: 2px; background: #5B7CFA"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; justify-content: center; align-items: center; gap: 16px"><span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #5B7CFA; border: 2px solid #FFFFFF"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = 2;
    const knots = [0, 1, 2, 3, 4].map((i) => ({ gapW: i === 0 ? '0px' : '28px', line: i <= cur ? '#5B7CFA' : '#2E323D', fill: i <= cur ? '#5B7CFA' : '#0D0F15', ring: i <= cur ? '#5B7CFA' : '#4A4F5C' }));
    const picked = (this.state && this.state.dye) || 'Indigo';
    const list = [['Indigo', '#5B7CFA'], ['Woad', '#2EC4C4'], ['Weld', '#46C27A'], ['Saffron', '#F5A524'], ['Madder', '#E5484D'], ['Cochineal', '#D152A6']];
    const dye = list.find((d) => d[0] === picked)[1];
    const dyes = list.map((d) => ({ name: d[0], hex: d[1], checked: d[0] === picked ? 'true' : 'false', ring: d[0] === picked ? '#FFFFFF' : 'transparent', pick: () => this.setState({ dye: d[0] }) }));
    return { knots, dye, dyes };
  }
}
</script>
</body>
</html>
