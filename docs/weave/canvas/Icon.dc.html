<!doctype html>
<html lang="en">
<head>

<title>Weave icon</title>

<body>
<x-dc>
<helmet>
<style>

</style>
</helmet>
<div role="img" aria-label="{{label}}" style="position: relative; width: {{px}}; height: {{px}}; border-radius: {{radius}}; overflow: hidden; background-color: {{dye}}; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 1px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 1px, transparent 1px, transparent 3px); box-shadow: inset 0 -{{edge}} 0 rgba(0,0,0,0.18)">
  <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 48 48" fill="none" stroke="#FFFFFF" stroke-width="{{sw}}" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; inset: 0">
    <path d="M6 42.5 H42" stroke="{{tint}}" stroke-width="1.6" stroke-opacity="0.85"></path>
    <sc-for list="{{paths}}" as="p" hint-placeholder-count="3"><path d="{{p.d}}" fill="{{p.fill}}"></path></sc-for>
  </svg>
</div>
</x-dc>

    const key = this.props.app ?? 'files';
    const it = I[key] || I.files;
    const size = this.props.size ?? 64;
    const tint = it[0] === '#2A2D36' || it[0] === '#4B505E' ? '#9AA0AE' : 'rgba(255,255,255,0.9)';
    return {
      dye: it[0], label: it[1], paths: it[2],
      px: size + 'px', radius: Math.round(size * 0.26) + 'px', edge: Math.max(1, Math.round(size / 32)) + 'px',
