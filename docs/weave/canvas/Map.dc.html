<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map, night</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FA5FF}a:hover{color:#B7C5FF}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0D0F15; font-family: Inter, system-ui, sans-serif; color: #ECEDF2">
  <section aria-label="Map window" style="position: absolute; left: 16px; top: 14px; width: 1408px; height: 800px; border-radius: 10px; overflow: hidden; background: #0F1218; border: 1px solid #2E323D; box-shadow: 0 22px 56px rgba(0,0,0,0.5); display: flex; flex-direction: column">
    <div style="height: 3px; background: #5B7CFA"></div>
    <div style="height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; background-color: #21242C; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(255,255,255,0.016) 0px, rgba(255,255,255,0.016) 1px, transparent 1px, transparent 3px); border-bottom: 1px solid #2B2F3A">
      <div style="width: 18px; height: 18px; border-radius: 5px; background: #2F9A5C"></div>
      <div style="font-size: 13px; font-weight: 700">Map</div>
      <div style="font-size: 13px; color: #8A90A0">To Weavers' Market</div>
      <div style="flex-grow: 1"></div>
      <div style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.05)">
        <button aria-label="Minimise" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B4B9C6" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
        <button aria-label="Maximise" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B4B9C6" stroke-width="2.4" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
        <button aria-label="Close" style="width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(229,72,77,0.16); display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF6B6F" stroke-width="2.6" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      </div>
    </div>

    <div style="position: relative; flex-grow: 1">
      <!-- the town: streets are threads, the route is the one dyed -->
      <svg role="img" aria-label="Map of the town with a walking route from Home to Weavers' Market across Bobbin Bridge" width="1406" height="758" viewBox="0 0 1406 758" style="position: absolute; left: 0; top: 0">
        <rect x="0" y="0" width="1406" height="758" fill="#0F1218"></rect>
        <g fill="#151922">
          <rect x="420" y="40" width="160" height="110" rx="6"></rect><rect x="600" y="40" width="200" height="110" rx="6"></rect><rect x="820" y="40" width="150" height="110" rx="6"></rect>
          <rect x="420" y="170" width="160" height="130" rx="6"></rect><rect x="820" y="170" width="150" height="130" rx="6"></rect>
          <rect x="1000" y="40" width="180" height="260" rx="6"></rect><rect x="1200" y="40" width="190" height="120" rx="6"></rect><rect x="1200" y="180" width="190" height="120" rx="6"></rect>
          <rect x="420" y="520" width="200" height="110" rx="6"></rect><rect x="640" y="520" width="180" height="110" rx="6"></rect><rect x="1000" y="540" width="170" height="190" rx="6"></rect><rect x="1190" y="540" width="200" height="90" rx="6"></rect>
          <rect x="420" y="650" width="200" height="100" rx="6"></rect><rect x="640" y="650" width="180" height="100" rx="6"></rect><rect x="1190" y="650" width="200" height="100" rx="6"></rect>
        </g>
        <path d="M600 170 H800 V300 H600 Z" fill="#14281C"></path>
        <g stroke="#1E3A28" stroke-width="1"><path d="M610 190 l20 20 M650 180 l20 20 M700 200 l20 20 M740 185 l20 20 M620 250 l20 20 M680 260 l20 20 M750 250 l20 20"></path></g>
        <!-- the river -->
        <path d="M370 420 C 600 360, 760 470, 1000 410 S 1300 380, 1420 420 L1420 500 C 1300 460, 1150 500, 1000 490 S 600 440, 370 500 Z" fill="#12333B"></path>
        <path d="M370 460 C 600 400, 760 510, 1000 450 S 1300 420, 1420 460" stroke="#1E7F86" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 8" fill="none"></path>
        <!-- streets -->
        <g stroke="#262B36" stroke-width="10" fill="none" stroke-linecap="round">
          <path d="M400 20 V740"></path><path d="M590 20 V320"></path><path d="M810 20 V320"></path><path d="M990 20 V320"></path><path d="M1190 20 V320"></path>
          <path d="M400 160 H1400"></path><path d="M400 310 H1400"></path><path d="M630 520 V740"></path><path d="M990 520 V740"></path><path d="M400 640 H1400"></path><path d="M400 520 H1400"></path>
        </g>
        <g stroke="#3A4150" stroke-width="16" fill="none" stroke-linecap="round"><path d="M400 330 C 600 330, 650 360, 700 420 S 760 510, 830 520"></path></g>
        <path d="M672 390 L 740 470" stroke="#C9CDD8" stroke-width="20" stroke-linecap="round" stroke-opacity="0.18"></path>
        <!-- the route -->
        <path d="M480 700 V640 H630 V520 H700 C 720 500, 730 470, 706 430 L 676 396 C 700 360, 760 330, 810 320 V160 H990 V110 H1100" fill="none" stroke="#0F1218" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="M480 700 V640 H630 V520 H700 C 720 500, 730 470, 706 430 L 676 396 C 700 360, 760 330, 810 320 V160 H990 V110 H1100" fill="none" stroke="#5B7CFA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle cx="480" cy="700" r="10" fill="#FFFFFF" stroke="#5B7CFA" stroke-width="4"></circle>
        <circle cx="1100" cy="110" r="12" fill="#5B7CFA" stroke="#FFFFFF" stroke-width="3"></circle>
        <!-- where you are -->
        <circle cx="630" cy="560" r="22" fill="#5B7CFA" fill-opacity="0.18"></circle>
        <circle cx="630" cy="560" r="8" fill="#FFFFFF" stroke="#5B7CFA" stroke-width="3"></circle>
        <g font-family="Inter, sans-serif" font-size="12" fill="#8A90A0">
          <text x="640" y="240">Linen Park</text><text x="1140" y="440" fill="#4FA3AA">River Warp</text><text x="1010" y="100">Weavers' Market</text><text x="420" y="728">Home</text><text x="700" y="456" fill="#B4B9C6">Bobbin Bridge</text><text x="1210" y="250">Dyers' Row</text>
        </g>
      </svg>

      <!-- the route, as a card over the map -->
      <aside aria-label="Directions" style="position: absolute; left: 16px; top: 16px; width: 340px; border-radius: 16px; background: #1A1C23; border: 1px solid #2E323D; box-shadow: 0 16px 40px rgba(0,0,0,0.5); overflow: hidden">
        <div style="padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px dashed #2E323D">
          <div style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 9px; background: #14161B"><span style="width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 3px solid #5B7CFA"></span><span style="font-size: 14px">Home</span></div>
          <div style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 9px 9px 3px 3px; background: #14161B; border-bottom: 2px solid #5B7CFA"><span style="width: 10px; height: 10px; border-radius: 50%; background: #5B7CFA"></span><span style="font-size: 14px; font-weight: 600">Weavers' Market</span></div>
          <div role="group" aria-label="How" style="display: flex; padding: 3px; border-radius: 9px; background: #14161B; border: 1px solid #2E323D">
            <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
              <button onClick="{{m.pick}}" style="flex: 1; height: 30px; border-radius: 6px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font: 600 12.5px Inter, sans-serif; box-shadow: {{m.shadow}}">{{m.name}}</button>
            </sc-for>
          </div>
        </div>
        <div style="padding: 14px 16px; display: flex; align-items: baseline; gap: 10px">
          <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em">{{eta}}</span>
          <span style="font-size: 13.5px; color: #9AA0AE">{{dist}} · arrive {{arrive}}</span>
        </div>
        <div style="position: relative; padding: 0 16px 16px 40px">
          <div style="position: absolute; left: 22px; top: 6px; bottom: 22px; width: 2px; background: #5B7CFA"></div>
          <div style="display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{turns}}" as="t" hint-placeholder-count="5">
              <div style="position: relative; display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px">
                <span style="position: absolute; left: -23px; top: 3px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; background: {{t.fill}}; border: 2px solid #5B7CFA"></span>
                <span>{{t.what}}</span><span style="color: #8A90A0; white-space: nowrap">{{t.d}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="padding: 0 14px 14px"><button style="width: 100%; height: 40px; border-radius: 10px; border: 0; background: #5B7CFA; color: #FFFFFF; font: 600 14px Inter, sans-serif">Start, on the shuttle</button></div>
      </aside>

      <div style="position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; flex-direction: column; border-radius: 12px; background: #1A1C23; border: 1px solid #2E323D; overflow: hidden">
          <button aria-label="Zoom in" style="width: 42px; height: 42px; border: 0; border-bottom: 1px dashed #2E323D; background: transparent; color: #ECEDF2; font: 600 20px Inter, sans-serif">+</button>
          <button aria-label="Zoom out" style="width: 42px; height: 42px; border: 0; background: transparent; color: #ECEDF2; font: 600 20px Inter, sans-serif">−</button>
        </div>
        <button aria-label="Where am I" style="width: 42px; height: 42px; border-radius: 12px; border: 1px solid #2E323D; background: #1A1C23; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FA5FF" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
        <button aria-label="Layers" style="width: 42px; height: 42px; border-radius: 12px; border: 1px solid #2E323D; background: #1A1C23; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ECEDF2" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg></button>
      </div>

      <div style="position: absolute; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: #8A90A0">
        <span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start"><span style="width: 80px; height: 6px; border: 2px solid #8A90A0; border-top: 0; box-sizing: border-box"></span>200 m</span>
        <span>Map data © OpenStreetMap contributors</span>
      </div>
    </div>
  </section>

  <nav aria-label="Loom" style="position: absolute; left: 16px; right: 16px; bottom: 14px; height: 58px; box-sizing: border-box; border-radius: 14px; background-color: #181A20; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.022) 0px, rgba(255,255,255,0.022) 1px, transparent 1px, transparent 3px); border: 1px solid #2E323D; display: flex; align-items: center; padding: 0 10px; gap: 14px">
    <span style="width: 40px; height: 40px; border-radius: 10px; background: #5B7CFA"></span>
    <div style="flex-grow: 1; display: flex; justify-content: center; gap: 10px"><span style="width: 38px; height: 38px; border-radius: 10px; background: #4A6BE0"></span><span style="width: 38px; height: 38px; border-radius: 10px; background: #1FA3A3"></span><span style="position: relative; width: 38px; height: 38px; border-radius: 10px; background: #2F9A5C"><span style="position: absolute; left: 4px; right: 4px; bottom: -10px; height: 3px; border-radius: 2px; background: #5B7CFA"></span></span><span style="width: 38px; height: 38px; border-radius: 10px; background: #C77F0A"></span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; padding: 0 6px 0 12px; border-left: 1px dashed #2E323D; line-height: 1.15"><div style="font-size: 15px; font-weight: 700">17:42</div><div style="font-size: 11px; color: #9AA0AE">Fri 20 Nov</div></div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = (this.state && this.state.mode) || 'Walk';
    const data = { Walk: ['18 min', '1.4 km', '18:00'], Bike: ['7 min', '1.6 km', '17:49'], Car: ['9 min', '2.3 km', '17:51'], Tram: ['12 min', '1.5 km', '17:54'] };
    const modes = Object.keys(data).map((m) => ({ name: m, bg: m === mode ? '#2A2D36' : 'transparent', fg: m === mode ? '#FFFFFF' : '#B4B9C6', shadow: m === mode ? 'inset 0 -2px 0 #5B7CFA' : 'none', pick: () => this.setState({ mode: m }) }));
    const turns = [
      { what: 'Out of the door, left', d: '150 m', fill: '#FFFFFF' },
      { what: 'Right at Loom Street', d: '200 m', fill: '#1A1C23' },
      { what: 'Over Bobbin Bridge', d: '260 m', fill: '#1A1C23' },
      { what: 'Along Linen Park', d: '480 m', fill: '#1A1C23' },
      { what: 'Weavers’ Market, on the right', d: '', fill: '#5B7CFA' }
    ];
    const d = data[mode];
    return { modes, eta: d[0], dist: d[1], arrive: d[2], turns };
  }
}
</script>
</body>
</html>
