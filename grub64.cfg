# Boot menu for the 64-bit kernel (one disc for BIOS and for UEFI)
#
# 'insmod all_video' pulls in the graphics drivers - under UEFI that is
# efi_gop, the only way to a framebuffer there, because UEFI has no VGA
# text mode at all.
insmod all_video
set gfxpayload=keep

set timeout=0
set default=0

menuentry "ThreadOS 64" {
    multiboot2 /boot/threados64.bin
    module2 /boot/initrd64.img initrd64
}
